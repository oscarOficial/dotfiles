# ~/.tmux.conf — configuración sencilla y estándar, sin plugins.
# Prefijo: Ctrl+b (el de serie). Recargar: prefijo + r

# --- General -----------------------------------------------------------------
set -g mouse on                      # ratón para seleccionar paneles, redimensionar y hacer scroll
set -g history-limit 50000           # más historial
set -g base-index 1                  # ventanas empiezan en 1
setw -g pane-base-index 1            # paneles empiezan en 1
set -g renumber-windows on           # renumera al cerrar una ventana
set -g set-titles on

# --- Recomendado por Neovim (:checkhealth) -----------------------------------
set -sg escape-time 10
set -g focus-events on
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# --- Atajos ------------------------------------------------------------------
# Recargar la configuración
bind r source-file ~/.tmux.conf \; display "Configuración recargada"

# Dividir con | y - abriendo en el directorio actual
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Moverse entre paneles con h j k l (estilo Vim)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Redimensionar paneles con H J K L (se puede repetir)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# --- Modo copia estilo Vim ---------------------------------------------------
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# --- Barra de estado ---------------------------------------------------------
set -g status-position bottom
set -g status-style "bg=default,fg=white"
set -g status-left "#[bold] #S "
set -g status-right "#H  %H:%M "
setw -g window-status-current-style "fg=cyan,bold"
