# Yazi keymap configuration - LINUX
# Key mappings for yazi with bash plugins

[mgr]
prepend_keymap = [
  # Recursive file search by NAME/PATH (fd + fzf)
  { on = [ "z", "f" ], run = "plugin fazif faziffd", desc = "Find file by name (recursive)" },

  # Search by CONTENT (ripgrep + fzf + bat preview)
  { on = [ "z", "g" ], run = "plugin fazif fazifrg", desc = "Find by content (ripgrep)" },

  # Smart filter (improved native filter for current dir)
  { on = [ "F" ], run = "plugin smart-filter", desc = "Smart filter (current dir)" },

  # Quick jump to char (vim-like f-motion)
  { on = [ "f" ], run = "plugin jump-to-char", desc = "Jump to char (vim-like)" },

]

[input]
# Keymaps for input

